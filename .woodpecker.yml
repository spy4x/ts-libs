# Woodpecker CI (self-hosted, same instance as spy4x/template and spy4x/preact-components).
#
# The `when` guard is explicit on purpose. The sibling repo `preact-components`
# shipped `deno task check` with no guard, so the pipeline ran on every event the
# webhook delivered (`bad_habit`). No precedent for the fix exists in that repo's
# git history (`git log --all | grep -i bad_habit` finds nothing, and no sibling
# repo under ~/sync/code carries that fix), so this is the standard Woodpecker
# shape: pushes to main, pull requests targeting main, and tag builds. PRs are
# what the reviewer gate needs. A tag build runs the same checks and then publishes to JSR
# (#78). Tags get their own entry because a tag build has no branch to match `main` against.
when:
  - event: [push, pull_request]
    branch: main
  - event: tag
    ref: refs/tags/v*

# The integration tier's dependencies (#74). Same seven services as
# `infra/compose.integration.yml`, same exact version pins; only the addresses
# differ, because Woodpecker publishes a service under its own name as hostname on
# the container's own port. The credentials are the same obviously fake literal, and
# these containers live for one pipeline run.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: integration-test-only
      POSTGRES_PASSWORD: integration-test-only
      POSTGRES_DB: integration-test-only

  minio:
    # Upstream MinIO images are no longer anonymously pullable; see the note in
    # `infra/compose.integration.yml`.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    environment:
      MINIO_ROOT_USER: integration-test-only
      MINIO_ROOT_PASSWORD: integration-test-only
    commands:
      - minio server /data --address :9000 --console-address :9001

  mailpit:
    image: axllent/mailpit:v1.31.2
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_VERSION_CHECK: "true"

  redis:
    image: redis:8.10.2-alpine

  # Password-protected twin of `redis`, for the AUTH tests (#360).
  redis-auth:
    image: redis:8.10.2-alpine
    commands:
      - redis-server --requirepass integration-test-only

  # CalDAV servers (#417); see `infra/compose.integration.yml` for the Stalwart
  # setup script. Woodpecker services take no pids or memory limit, so only the
  # compose file caps them. `$$` keeps Woodpecker from substituting the variables.
  radicale:
    image: tomsquest/docker-radicale:3.8.3.0

  stalwart:
    image: stalwartlabs/stalwart:v0.16.25
    environment:
      STALWART_RECOVERY_ADMIN: admin:integration-test-only
      HTTPS_PROXY: http://127.0.0.1:9
    commands:
      - |
          if [ ! -f /etc/stalwart/config.json ]; then
            STALWART_RECOVERY_MODE_PORT=8081 stalwart --config /etc/stalwart/config.json &
            pid=$$!
            until curl -fsS -o /dev/null -u "$$STALWART_RECOVERY_ADMIN" http://127.0.0.1:8081/jmap/session; do sleep 0.5; done
            curl -fsS -o /dev/null -u "$$STALWART_RECOVERY_ADMIN" -H 'Content-Type: application/json' -d '{"using":["urn:ietf:params:jmap:core","urn:stalwart:jmap"],"methodCalls":[["x:Bootstrap/set",{"update":{"singleton":{"serverHostname":"localhost","defaultDomain":"example.com","requestTlsCertificate":false,"generateDkimKeys":false}}},"0"]]}' http://127.0.0.1:8081/jmap/
            kill "$$pid"
            wait "$$pid" || true
          fi
          exec stalwart --config /etc/stalwart/config.json

# Steps run in declaration order. Unit first, integration second, which is the order
# issue #74 asks for: format, lint, types and the unit suite fail in seconds, the
# integration tier takes a container start-up to fail.
steps:
  check:
    image: denoland/deno:2.9.7
    commands:
      - deno --version
      # `check:cold` (#112), not `check`: `CI=true` alone does not freeze `deno.lock` — a task
      # that resolves an import missing from the lockfile rewrites it and still exits 0. The
      # cold script compares the lockfile before and after and fails the run when it changed.
      # `publish:dry` (#190) runs in the same cold cache on every PR: a failure only publishing
      # catches, such as two packages importing each other, then fails the PR instead of the tag.
      - deno task check:cold check publish:dry

  integration:
    image: denoland/deno:2.9.7
    environment:
      TS_LIBS_IT_POSTGRES_URL: postgres://integration-test-only:integration-test-only@postgres:5432/integration-test-only
      TS_LIBS_IT_S3_ENDPOINT: http://minio:9000
      TS_LIBS_IT_SMTP_HOST: mailpit
      TS_LIBS_IT_SMTP_PORT: "1025"
      TS_LIBS_IT_MAILPIT_URL: http://mailpit:8025
      TS_LIBS_IT_REDIS_HOST: redis
      TS_LIBS_IT_REDIS_PORT: "6379"
      TS_LIBS_IT_REDIS_AUTH_HOST: redis-auth
      TS_LIBS_IT_REDIS_AUTH_PORT: "6379"
      TS_LIBS_IT_RADICALE_URL: http://radicale:5232
      TS_LIBS_IT_STALWART_URL: http://stalwart:8080
    commands:
      - deno task test:integration

  # A `v*` tag publishes to JSR with the global token, so the tagged commit must already be on
  # `main` (reviewed, green CI). A tag on an unmerged branch stops here, before `publish` runs.
  # Woodpecker's clone is shallow and has no `main`, so fetch it with full depth first.
  on-main:
    image: alpine/git:2.47.2
    when:
      event: tag
      ref: refs/tags/v*
    commands:
      - git fetch --no-tags --depth=2147483647 origin main
      - git merge-base --is-ancestor "$${CI_COMMIT_SHA}" FETCH_HEAD || { echo "Refusing to publish, commit $${CI_COMMIT_SHA} is not on main"; exit 1; }

  # Publishes every workspace member to JSR (`jsr:@spy4x/*`), only on a `v*` tag and only after
  # both check steps above passed. `AGENTS.md` ("Releasing") has the process; the owner gives the
  # go-ahead for every tag, because JSR never deletes a version. A version already on JSR is
  # skipped, so re-running a tag build that failed part-way publishes only what is missing.
  # `$$` stops Woodpecker substituting the variable itself; the shell reads the secret.
  publish:
    image: denoland/deno:2.9.7
    when:
      event: tag
      ref: refs/tags/v*
    environment:
      JSR_TOKEN:
        from_secret: JSR_TOKEN
    commands:
      - deno publish --token "$${JSR_TOKEN}"
