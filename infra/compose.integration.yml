# Dependencies of the integration test tier (issue #74), for local runs.
#
# Start them with `deno task services:up` and stop them with `deno task services:down`.
# CI does not use this file: Woodpecker starts the same images through the
# `services:` block of `.woodpecker.yml`, and the tests find them through the same
# environment variables.
#
# Three rules this file exists to hold:
#
# 1. **A fixed project name.** `name:` below pins it, so these containers can never
#    be confused with — or removed together with — anything else on the machine.
#    Every compose command must carry `-f infra/compose.integration.yml`, which the
#    `services:*` tasks do.
# 2. **Loopback only.** Every published port is bound to `127.0.0.1`, and the host
#    ports are deliberately unusual (the 5xxxx range) so they cannot collide with a
#    Postgres, MinIO, mail or Redis server already running on the developer's machine.
# 3. **Obviously fake credentials.** `integration-test-only` is the user, the
#    password and the database name everywhere a service takes one (`redis` takes
#    none: no `requirepass`, same as every other service here on a loopback-only
#    port; `redis-auth` takes the literal as its password). These containers hold
#    throw-away data, are reachable from the loopback interface only, and the
#    string is meant to be unmistakable if it ever shows up in a log or a bug
#    report.
#
# Images are pinned to an exact version tag, never `latest`, for the same reason the
# import map pins every dependency: a silent upgrade turns a green suite red with no
# commit to blame.

name: ts-libs-it

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: integration-test-only
      POSTGRES_PASSWORD: integration-test-only
      POSTGRES_DB: integration-test-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration-test-only -d integration-test-only"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # `pgsty/minio` is a community fork that keeps building MinIO. Upstream stopped
  # publishing: `minio/minio` on Docker Hub refuses anonymous pulls, and on
  # 2026-09-25 `quay.io/minio/minio` started answering 401 too, which failed the
  # v1.3.0 tag build. Same binary, same `minio server` command and env names.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: integration-test-only
      MINIO_ROOT_PASSWORD: integration-test-only
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # `MP_SMTP_AUTH_ACCEPT_ANY` plus `MP_SMTP_AUTH_ALLOW_INSECURE` make Mailpit
  # advertise AUTH on a plaintext port and accept any credentials, so the adapter's
  # real AUTH exchange runs. Mailpit serves no STARTTLS without a certificate, so an
  # integration test against it must pass `requireTls: false` explicitly.
  # Messages are kept in memory: no volume, nothing survives a restart.
  mailpit:
    image: axllent/mailpit:v1.31.2
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # No `requirepass`: most tests need no AUTH, and the container is reachable from
  # loopback only, like the others. `redis-auth` below covers the password path.
  # No volume: throw-away keys, nothing survives a restart.
  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # A second instance with `requirepass`, for the AUTH handshake (#360). A second
  # service rather than an ACL user on `redis`: a user needs an ACL file or a startup
  # command per user and the tests would share one server anyway, while this is one
  # flag and leaves the password-free instance every other test uses untouched.
  # The password is the repository's one throw-away credential.
  redis-auth:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--requirepass", "integration-test-only"]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "integration-test-only", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # CalDAV servers for `@spy4x/caldav` (#417). Radicale runs its default config,
  # which accepts any login and gives every username its own principal, so each
  # run picks a fresh username. No volume: throw-away calendars.
  # `pids_limit` and `mem_limit` cap a runaway server; the older services predate the rule.
  radicale:
    image: tomsquest/docker-radicale:3.8.3.0
    ports:
      - "127.0.0.1:55232:5232"
    pids_limit: 500
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5232/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # Stalwart 0.16 has no config file until its setup runs, so the entrypoint runs
  # it headless once: start in recovery mode on 8081, finish the setup over JMAP
  # with the recovery admin (`x:Bootstrap/set`, domain `example.com`, no TLS
  # certificate, no DKIM), stop, then start for real with DAV on 8080. Tests create
  # their own user per run through JMAP (`infra/testing/stalwart.ts`).
  # `HTTPS_PROXY` points at a closed port so the web admin download fails at once
  # instead of holding up the start for a minute; the tests need no web admin.
  # `$$` is compose's escape for a literal `$` in the script.
  stalwart:
    image: stalwartlabs/stalwart:v0.16.25
    entrypoint: ["sh", "-c"]
    command:
      - |
          set -eu
          if [ ! -f /etc/stalwart/config.json ]; then
            STALWART_RECOVERY_MODE_PORT=8081 stalwart --config /etc/stalwart/config.json &
            pid=$$!
            until curl -fsS -o /dev/null -u "$$STALWART_RECOVERY_ADMIN" http://127.0.0.1:8081/jmap/session; do sleep 0.5; done
            curl -fsS -o /dev/null -u "$$STALWART_RECOVERY_ADMIN" -H 'Content-Type: application/json' -d '{"using":["urn:ietf:params:jmap:core","urn:stalwart:jmap"],"methodCalls":[["x:Bootstrap/set",{"update":{"singleton":{"serverHostname":"localhost","defaultDomain":"example.com","requestTlsCertificate":false,"generateDkimKeys":false}}},"0"]]}' http://127.0.0.1:8081/jmap/
            kill "$$pid"
            wait "$$pid" || true
          fi
          exec stalwart --config /etc/stalwart/config.json
    environment:
      STALWART_RECOVERY_ADMIN: admin:integration-test-only
      HTTPS_PROXY: http://127.0.0.1:9
    ports:
      - "127.0.0.1:58080:8080"
    pids_limit: 500
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthz/live"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

volumes:
  postgres-data:
  minio-data:
